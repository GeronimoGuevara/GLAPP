[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Cron Job para verificar medicamentos cada minuto
[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuración del Cron Job - se ejecuta cada minuto para verificar medicamentos
[functions.cron-check-meds]
  schedule = "* * * * *"
